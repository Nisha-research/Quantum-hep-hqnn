[server]
port = 8501
enableXsrfProtection = true
headless = true
runOnSave = false
maxUploadSize = 50

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "error"

[theme]
primaryColor = "#00ff88"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#ffffff"
font = "sans serif"
